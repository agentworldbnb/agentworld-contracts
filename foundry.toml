[profile.default]
src = "src"
test = "test"
libs = ["lib"]
solc = "0.8.37"
optimizer = true
optimizer_runs = 200
remappings = ["@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/"]
# Refuse network. Forge must use a solc 0.8.37 binary that is already installed.
offline = true
auto_detect_solc = false
ffi = false
script = "script"
